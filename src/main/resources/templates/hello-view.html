<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页面</title>
    <!-- Bootstrap5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f9fc;
        }
        .welcome-card {
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
        }
        .hero-bg {
            background: linear-gradient(135deg, #4080ff 0%, #2364d2 100%);
            color: white;
            border-radius: 14px 14px 0 0;
        }
    </style>
</head>
<body>
<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold">系统后台</a>
        <div class="d-flex">
            <a href="/api/logout" class="btn btn-outline-danger">退出登录</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card welcome-card">
                <div class="hero-bg p-5 text-center">
                    <h2 class="fw-bold">🎉 登录成功，欢迎使用系统</h2>
                    <p class="mb-0 opacity-75">Session‑Cookie认证演示项目</p>
                </div>
                <div class="card-body p-5">
                    <h5 class="mb-3">调用受保护接口 /api/hello 返回结果：</h5>
                    <div id="resultBox" class="alert alert-secondary">
                        <span class="text-muted">正在请求接口……</span>
                    </div>

                    <hr class="my-4">
                    <div>
                        <h5>RabbitMQ测试：发送消息</h5>
                        <button onclick="callSendApi()" class="btn btn-primary mt-2">调用 /send 发送消息</button>
                        <div id="sendResult" class="alert alert-secondary mt-3">等待调用接口</div>
                    </div>

                    <hr class="my-4">
                    <div>
                        <h6>功能说明</h6>
                        <ul class="text-secondary">
                            <li>登录信息保存在服务端Session，浏览器保存JSESSIONID Cookie</li>
                            <li>登录之后，地址栏直接访问受保护接口，浏览器自动携带Cookie</li>
                            <li>点击退出登录，服务端销毁会话，Cookie清除</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.onload = async function () {
        try {
            // session模式，fetch自动带上cookie，不需要header Authorization
            const res = await fetch("/api/hello");
            const text = await res.text();
            document.getElementById("resultBox").className = "alert alert-success";
            document.getElementById("resultBox").innerText = text;
        } catch (e) {
            document.getElementById("resultBox").className = "alert alert-danger";
            document.getElementById("resultBox").innerText = "网络请求异常";
            console.error(e);
        }
    }

    // 测试 MQ /send接口
    async function callSendApi(){
        const box = document.getElementById("sendResult");
        box.className = "alert alert-info";
        box.innerText = "正在调用 /send ...";
        try{
            const resp = await fetch("/send");
            const retText = await resp.text();
            box.className = "alert alert-success";
            box.innerText = retText;
        }catch(err){
            box.className = "alert alert-danger";
            box.innerText = "网络异常："+err;
        }
    }
</script>
</body>
</html>
