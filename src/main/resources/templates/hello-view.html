<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页面</title>
    <!-- Bootstrap5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f9fc;
        }
        .welcome-card {
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
        }
        .hero-bg {
            background: linear-gradient(135deg, #4080ff 0%, #2364d2 100%);
            color: white;
            border-radius: 14px 14px 0 0;
        }
    </style>
</head>
<body>
<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold">系统后台</a>
        <div class="d-flex">
            <a href="javascript:void(0)" onclick="doLogout()" class="btn btn-outline-danger">退出登录</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card welcome-card">
                <div class="hero-bg p-5 text-center">
                    <h2 class="fw-bold">🎉 登录成功，欢迎使用系统</h2>
                    <p class="mb-0 opacity-75">JWT 无状态认证演示项目</p>
                </div>
                <div class="card-body p-5">
                    <h5 class="mb-3">调用受保护接口 /api/hello 返回结果：</h5>
                    <div id="resultBox" class="alert alert-secondary">
                        <span class="text-muted">正在请求接口……</span>
                    </div>

                    <hr class="my-4">
                    <div>
                        <h5>RabbitMQ测试：发送消息</h5>
                        <button onclick="callSendApi()" class="btn btn-primary mt-2">调用 /send 发送消息</button>
                        <div id="sendResult" class="alert alert-secondary mt-3">等待调用接口</div>
                    </div>

                    <hr class="my-4">
                    <div>
                        <h5>订单测试：创建订单</h5>
                        <div class="input-group mb-3">
                            <input type="text" id="orderIdInput" class="form-control" placeholder="请输入订单号">
                            <button onclick="callCreateOrder()" class="btn btn-primary">创建订单</button>
                        </div>
                        <div id="orderResult" class="alert alert-secondary">等待调用接口</div>
                    </div>

                    <hr class="my-4">
                    <div>
                        <h6>功能说明</h6>
                        <ul class="text-secondary">
                            <li>登录信息以 JWT Token 保存在浏览器 localStorage，关闭浏览器不会丢失</li>
                            <li>每次请求通过 JS 在 Header 中携带 Authorization: Bearer token</li>
                            <li>点击退出登录，服务端将 Token 加入黑名单，前端清除 localStorage</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/api/login';
    }

    function authHeaders() {
        return { 'Authorization': 'Bearer ' + localStorage.getItem('token') };
    }

    async function authFetch(url) {
        var res = await fetch(url, { headers: authHeaders() });
        if (res.status === 401) {
            localStorage.removeItem('token');
            window.location.href = '/api/login';
            return null;
        }
        return res;
    }

    window.onload = async function () {
        try {
            var res = await authFetch("/api/hello");
            if (!res) return;
            var text = await res.text();
            document.getElementById("resultBox").className = "alert alert-success";
            document.getElementById("resultBox").innerText = text;
        } catch (e) {
            document.getElementById("resultBox").className = "alert alert-danger";
            document.getElementById("resultBox").innerText = "网络请求异常";
            console.error(e);
        }
    }

    async function callSendApi(){
        var box = document.getElementById("sendResult");
        box.className = "alert alert-info";
        box.innerText = "正在调用 /send ...";
        try{
            var resp = await authFetch("/send");
            if (!resp) return;
            var retText = await resp.text();
            box.className = "alert alert-success";
            box.innerText = retText;
        }catch(err){
            box.className = "alert alert-danger";
            box.innerText = "网络异常："+err;
        }
    }

    async function callCreateOrder() {
        var orderId = document.getElementById("orderIdInput").value.trim();
        if (!orderId) { alert("请输入订单号"); return; }
        var box = document.getElementById("orderResult");
        box.className = "alert alert-info";
        box.innerText = "正在下单 ...";
        try {
            var resp = await authFetch("/order/create/" + orderId);
            if (!resp) return;
            var retText = await resp.text();
            box.className = "alert alert-success";
            box.innerText = retText;
        } catch (err) {
            box.className = "alert alert-danger";
            box.innerText = "网络异常：" + err;
        }
    }

    async function doLogout() {
        try {
            await fetch("/api/logout", { method: "POST", headers: authHeaders() });
        } catch (e) { console.error(e); }
        localStorage.removeItem('token');
        window.location.href = '/api/login';
    }
</script>
</body>
</html>
