<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问被拒绝</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f7f9fc;}
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="text-center">
    <h2 class="text-secondary">访问被拒绝</h2>
    <p id="tipText" class="mt-3">正在跳转……</p>
</div>

<script>
    const token = localStorage.getItem("token");
    if(token){
        document.getElementById("tipText").innerText = "检测本地登录凭证，跳转到主页";
        setTimeout(()=>{
            window.location.href="/api/hello-view";
        },800);
    }else{
        document.getElementById("tipText").innerText = "未登录，跳转到登录页";
        setTimeout(()=>{
            window.location.href="/api/login";
        },800);
    }
</script>
</body>
</html>
