<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f7f9fc;}
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="text-center">
    <h2 class="text-secondary">404 页面地址不存在</h2>
    <p id="tipText" class="mt-3">正在跳转……</p>
</div>

<script>
    // 404页面JS读取localStorage判断登录状态
    const token = localStorage.getItem("token");
    if(token){
        // 已经登录，跳转到欢迎主页
        document.getElementById("tipText").innerText = "检测到已登录，正在跳转到主页";
        setTimeout(()=>{
            window.location.href="/api/hello-view";
        },800);
    }else{
        // 未登录，跳登录页
        document.getElementById("tipText").innerText = "未登录，跳转到登录页面";
        setTimeout(()=>{
            window.location.href="/api/login";
        },800);
    }
</script>
</body>
</html>
