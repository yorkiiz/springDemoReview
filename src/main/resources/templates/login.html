<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .login-box {
            max-width: 420px;
            margin-top: 120px;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="login-box">
            <div class="card p-4">
                <h3 class="text-center mb-4">系统登录</h3>
                <div class="mb-3">
                    <label class="form-label">账号</label>
                    <input id="username" type="text" class="form-control" placeholder="请输入账号" value="admin">
                </div>
                <div class="mb-4">
                    <label class="form-label">密码</label>
                    <input id="password" type="password" class="form-control" placeholder="请输入密码" value="123456">
                </div>
                <button onclick="submitLogin()" class="btn btn-primary w-100">提交登录</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========【新增关键】页面加载的时候自动执行 ==========
    window.onload = function(){
        const token = localStorage.getItem("token");
        // 如果本地已经存有token，直接跳转到欢迎页面，不用再登录
        if(token){
            console.log("检测到本地已有token，直接跳转欢迎页");
            window.location.href="/api/hello-view";
        }
    }

    async function submitLogin(){
        const un = document.getElementById("username").value;
        const pw = document.getElementById("password").value;

        const bodyParams = new URLSearchParams();
        bodyParams.append("username", un);
        bodyParams.append("password", pw);

        try {
            const res = await fetch("/api/doLogin",{
                method:"POST",
                headers:{
                    "Content-Type":"application/x-www-form-urlencoded"
                },
                body: bodyParams
            });

            if(!res.ok){
                const errText = await res.text();
                console.log("后端返回错误：", errText);
                alert("登录失败，请检查账号密码！");
                return;
            }
            const token = await res.text();
            localStorage.setItem("token",token);
            alert("登录成功，跳转页面");
            window.location.href="/api/hello-view";

        }catch (err){
            console.error(err);
            alert("网络异常");
        }
    }
</script>
</body>
</html>
