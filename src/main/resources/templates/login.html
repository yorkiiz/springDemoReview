<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统登录</title>
    <style>
        .login-box{width:500px;margin:80px auto;font-family:system-ui;}
        .card{border:1px solid #ddd;border-radius:12px;padding:30px;}
        .form-item{margin-bottom:16px;}
        .form-control{width:100%;box-sizing:border-box;padding:10px 12px;margin-top:8px;border:1px solid #ccc;border-radius:6px;font-size:16px;}
        .submit-btn{width:100%;padding:12px;border:none;border-radius:6px;background:#1677ff;color:white;font-size:17px;cursor:pointer;}
        .error-msg{color:red;text-align:center;margin-top:10px;display:none;}
    </style>
</head>
<body>
<div class="login-box">
    <div class="card">
        <h2 style="text-align:center;margin-top:0;">系统登录</h2>
        <form id="loginForm">
            <div class="form-item">
                <label>账号</label>
                <input class="form-control" name="username" type="text" value="admin">
            </div>
            <div class="form-item">
                <label>密码</label>
                <input class="form-control" name="password" type="password" value="123456">
            </div>
            <button class="submit-btn" type="submit">提交登录</button>
            <p class="error-msg" id="errorMsg"></p>
        </form>
    </div>
</div>
<script>
    if (localStorage.getItem('token')) {
        window.location.href = '/api/hello-view';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var formData = new FormData(this);
        fetch('/api/doLogin', {
            method: 'POST',
            body: formData
        })
        .then(function(res) {
            if (!res.ok) throw new Error('登录失败');
            return res.text();
        })
        .then(function(token) {
            localStorage.setItem('token', token);
            window.location.href = '/api/hello-view';
        })
        .catch(function() {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').innerText = '账号或密码错误';
        });
    });
</script>
</body>
</html>
